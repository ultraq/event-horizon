plugins {
	id 'idea'
	id 'nz.net.ultraq.gradle.fluent-configuration' version '0.6.0'
}

description = 'An async, in-process, event system'
version = '0.2.0-SNAPSHOT'
group = 'nz.net.ultraq'

// @formatter:off
configure {
	createGroovyProject()
		.useJavaVersion(17)
		.useMavenCentralRepositories()
		.withJarOptions() {
			manifest {
				attributes 'Automatic-Module-Name': 'nz.net.ultraq.eventhorizon'
			}
		}
		.withGroovydocOptions() {
			overviewText = resources.text.fromString('''
				An async, in-process, event system.  Originally, the event system for the
				<a href="https://github.com/ultraq/redhorizon">Red Horizon</a> game engine,
				hence the name.
			''')
		}
		.withSourcesJar()
		.withGroovydocJar()
		.configureSource()
			.withSourceDirectory('source')
			.withDependencies {
				implementation 'org.apache.groovy:groovy:4.0.28'
				implementation 'org.slf4j:slf4j-api:2.0.17'
			}
		.configureVerification()
			.withTestDirectory('test')
			.withTestDependencies() {
				testImplementation 'org.slf4j:slf4j-simple:2.0.17'
				testImplementation 'org.spockframework:spock-core:2.3-groovy-4.0'
			}
			.useJUnitJupiter()
			.useJacoco()

	createMavenPublication()
		.withArtifacts(jar, sourcesJar, groovydocJar)
		.configurePom() {
			url = 'https://github.com/ultraq/event-horizon'
			inceptionYear = '2019'
		}
		.useApache20License()
		.withGitHubScm('ultraq')
		.withDevelopers([
			name: 'Emanuel Rabina',
			email: 'emanuelrabina@gmail.com',
			url: 'https://www.ultraq.net.nz'
		])
		.publishToMavenCentral(
			findProperty('mavenCentral.publisher.username'),
			findProperty('mavenCentral.publisher.password')
		)
}
// @formatter:on
